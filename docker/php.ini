; 正式環境的 PHP 設定（docs/deploy.md），以 php.ini-production 為基礎。

; 上傳上限 5 MB（docs/SPEC.md 第 9 節）；留一點餘裕給表單的其他欄位
upload_max_filesize = 8M
post_max_size = 10M
; 音檔轉檔最多等 60 秒（App\Media\MediaProcessor）
max_execution_time = 90
memory_limit = 256M
expose_php = Off

; 程式只會隨映像檔更新，不必檢查檔案是否變動
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
